<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAJD/CHESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0e0e0e; --ink: #ececec; --muted: #8a8a8a; --accent: #ff6a33; --accent-soft: #3a2115;
    --sq-light: #5c5c58; --sq-dark: #2b2b29; --piece-dark: #0e0e0e; --piece-light: #f2f2f2;
    --line: 3px; --size: min(86vw, 76vh, 620px);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 15px/1.4 "Space Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { display: flex; gap: 40px; padding: 24px 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }

  /* ---------- board ---------- */
  .board-area { display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; gap: 8px 10px; position: relative; }
  .evalbar { width: 14px; height: var(--size); border: var(--line) solid var(--ink); background: var(--piece-dark); position: relative; }
  .evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--piece-light); transition: height .5s cubic-bezier(.2, .8, .2, 1); }
  .evalbar.black-bottom .fill { bottom: auto; top: 0; }
  #ranks, #files { display: flex; font: 700 12px var(--mono); color: var(--muted); }
  #ranks { flex-direction: column; height: var(--size); }
  #ranks span { flex: 1; display: flex; align-items: center; }
  #files { grid-column: 3; width: var(--size); }
  #files span { flex: 1; text-align: center; text-transform: uppercase; }

  #board {
    width: var(--size); height: var(--size); display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr);
    outline: var(--line) solid var(--ink); user-select: none; touch-action: none;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; background: var(--sq-light); }
  .sq.d { background: var(--sq-dark); }
  .sq.last { background-image: linear-gradient(rgba(255, 106, 51, .35), rgba(255, 106, 51, .35)); }
  .sq.sel { box-shadow: inset 0 0 0 4px var(--accent); }
  .sq.check { background: var(--accent); }
  .sq.move::after { content: ""; position: absolute; width: 16%; height: 16%; background: var(--ink); }
  .sq.capture::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--ink); }

  .pc {
    position: relative; z-index: 1; font-size: calc(var(--size) / 8 * .8); line-height: 1; cursor: grab;
    paint-order: stroke fill;
  }
  .pc.w { color: var(--piece-light); -webkit-text-stroke: 1.4px var(--piece-dark); }
  .pc.b { color: var(--piece-dark); -webkit-text-stroke: 1.4px var(--piece-light); }
  .pc.ghost { position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, -50%) rotate(-6deg) scale(1.15); }

  #promo {
    position: absolute; top: 0; left: 0; right: 0; height: var(--size); display: none; align-items: center; justify-content: center;
    background: rgba(14, 14, 14, .85); z-index: 5;
  }
  #promo.open { display: flex; }
  #promo div { display: flex; border: var(--line) solid var(--ink); background: var(--paper); }
  #promo button { width: calc(var(--size) / 7); height: calc(var(--size) / 7); border: 0; border-right: var(--line) solid var(--ink); background: none; cursor: pointer; }
  #promo button:last-child { border-right: 0; }
  #promo button:hover { background: var(--accent); }
  #promo button:not(:hover) { background: var(--sq-light); }

  /* ---------- side panel ---------- */
  aside { width: 320px; display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-size: 76px; line-height: .82; font-weight: 700; letter-spacing: -4px; }
  h1 span { color: var(--accent); }
  .tagline { font: 12px var(--mono); color: var(--muted); margin-top: 10px; }
  #status { font-size: 28px; font-weight: 700; line-height: 1.05; min-height: 60px; text-transform: uppercase; letter-spacing: -.5px; }
  #status.thinking::after { content: "_"; color: var(--accent); animation: blink-text .6s steps(2) infinite; }
  @keyframes blink-text { 50% { opacity: 0; } }

  .label { display: flex; justify-content: space-between; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .label span:last-child { color: var(--accent); }
  .segmented { display: grid; border: var(--line) solid var(--ink); }
  .segmented button {
    font: 700 14px var(--mono); padding: 9px 0; background: none; color: var(--ink); border: 0; cursor: pointer;
    border-right: 2px solid var(--ink);
  }
  .segmented button:last-child { border-right: 0; }
  .segmented button:hover { background: var(--accent-soft); }
  .segmented button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  #levels { grid-template-columns: repeat(10, 1fr); }
  #colors { grid-template-columns: repeat(3, 1fr); }
  #colors button { font-family: "Space Grotesk", sans-serif; }

  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn {
    font: 700 14px "Space Grotesk", sans-serif; text-transform: uppercase; letter-spacing: .5px; padding: 11px 0;
    background: var(--paper); color: var(--ink); border: var(--line) solid var(--ink); cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: none; box-shadow: none; }
  .btn:disabled { opacity: .3; cursor: default; }
  #new-game { background: var(--accent); color: var(--piece-dark); border-color: var(--accent); width: 100%; font-size: 16px; padding: 14px 0; }

  .readout { display: flex; align-items: baseline; justify-content: space-between; border-top: var(--line) solid var(--ink); padding-top: 12px; }
  #eval-big { font: 700 44px var(--mono); letter-spacing: -2px; }
  #info { font: 11px/1.5 var(--mono); color: var(--muted); text-align: right; }
  #moves {
    height: 190px; overflow-y: auto; font: 13px var(--mono); border-top: 2px solid var(--ink);
    display: grid; grid-template-columns: 38px 1fr 1fr; align-content: start;
  }
  #moves span { padding: 5px 6px; border-bottom: 1px solid #262626; }
  #moves .n { color: var(--muted); }
  #moves span:last-child:not(.n) { color: var(--accent); font-weight: 700; }

  @media (max-width: 760px) {
    h1 { font-size: 56px; }
    aside { width: min(100%, calc(var(--size) + 50px)); }
  }
</style>
</head>
<body>
<main>
  <div class="board-area">
    <div class="evalbar" id="evalbar"><div class="fill" id="eval-fill"></div></div>
    <div id="ranks"></div>
    <div id="board"></div>
    <div id="files"></div>
    <div id="promo"><div id="promo-choices"></div></div>
  </div>

  <aside>
    <div>
      <h1>MAJD<br>CHESS<span>.</span></h1>
      <div class="tagline">// negamax · alpha-beta · written by majd</div>
    </div>
    <div id="status">Loading</div>
    <div>
      <div class="label"><span>Difficulty</span><span id="level-name"></span></div>
      <div class="segmented" id="levels"></div>
    </div>
    <div>
      <div class="label"><span>Play as</span></div>
      <div class="segmented" id="colors">
        <button data-color="white" aria-pressed="true">White</button>
        <button data-color="black" aria-pressed="false">Black</button>
        <button data-color="random" aria-pressed="false">Random</button>
      </div>
    </div>
    <button class="btn" id="new-game">New game →</button>
    <div class="actions">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="hint">Hint</button>
      <button class="btn" id="flip">Flip</button>
    </div>
    <div class="readout">
      <div id="eval-big">0.00</div>
      <div id="info">waiting for<br>first search</div>
    </div>
    <div id="moves"></div>
  </aside>
</main>

<script>
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const LEVEL_NAMES = ["Pushover", "Rookie", "Casual", "Club", "Solid",
                     "Sharp", "Strong", "Brutal", "Ruthless", "Majd mode"];
const $ = id => document.getElementById(id);
const board = $("board");

let state = null, human = "white", colorChoice = "white", level = 5, flipped = false;
let selected = null, busy = false, lastInfo = null, drag = null, hintMove = null;

async function api(moves, think, lvl = level) {
  const res = await fetch("/api", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ moves, think, level: lvl }),
  });
  if (!res.ok) throw new Error("server error");
  return res.json();
}

function pieces() {
  const map = {};
  state.fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += +ch;
      else map["abcdefgh"[f++] + (8 - r)] = ch;
    }
  });
  return map;
}

const isOwn = p => (p === p.toUpperCase()) === (human === "white");
const myTurn = () => state && !busy && !state.result && state.turn === human;
const isLegal = (from, to) => state.legal.some(m => m.startsWith(from + to));

function pieceEl(p) {
  const s = document.createElement("span");
  s.className = "pc " + (p === p.toUpperCase() ? "w" : "b");
  s.textContent = GLYPH[p.toLowerCase()] + "︎";  // force text glyph, not emoji
  return s;
}

function render() {
  const map = pieces();
  const whiteBottom = (human === "white") !== flipped;
  const hl = hintMove || state.moves.at(-1);
  const targets = selected ? state.legal.filter(m => m.startsWith(selected)).map(m => m.slice(2, 4)) : [];
  const files = whiteBottom ? "abcdefgh" : "hgfedcba";
  const ranks = whiteBottom ? "87654321" : "12345678";

  $("files").innerHTML = [...files].map(f => `<span>${f}</span>`).join("");
  $("ranks").innerHTML = [...ranks].map(r => `<span>${r}</span>`).join("");

  board.replaceChildren();
  for (const rank of ranks) {
    for (const file of files) {
      const sq = file + rank;
      const el = document.createElement("div");
      el.className = "sq " + (("abcdefgh".indexOf(file) + +rank) % 2 ? "d" : "l");
      el.dataset.sq = sq;
      if (hl && (hl.slice(0, 2) === sq || hl.slice(2, 4) === sq)) el.classList.add("last");
      if (sq === selected) el.classList.add("sel");
      if (sq === state.check) el.classList.add("check");
      if (targets.includes(sq)) el.classList.add(map[sq] ? "capture" : "move");
      if (map[sq]) el.append(pieceEl(map[sq]));
      board.append(el);
    }
  }

  const status = $("status");
  status.classList.toggle("thinking", busy);
  if (state.result) {
    const won = (state.result.score === "1-0") === (human === "white");
    const text = state.result.score === "1/2-1/2" ? "Draw." : won ? "You win." : "Majd wins.";
    status.textContent = `${text} ${state.result.reason}`;
  } else if (busy) status.textContent = "Thinking";
  else if (state.turn === human) status.textContent = state.check ? "Check. Your move." : "Your move.";
  else status.textContent = "Engine to move.";

  const moves = $("moves");
  moves.innerHTML = state.san.map((san, i) =>
    (i % 2 === 0 ? `<span class="n">${String(i / 2 + 1).padStart(2, "0")}</span>` : "") + `<span>${san}</span>`
  ).join("");
  moves.scrollTop = moves.scrollHeight;

  renderEval(whiteBottom);
  $("undo").disabled = busy || state.moves.length === 0;
  $("hint").disabled = !myTurn();
}

function renderEval(whiteBottom) {
  $("evalbar").classList.toggle("black-bottom", !whiteBottom);
  let pct = 50, text = "0.00";
  if (lastInfo) {
    if (lastInfo.mate) {
      pct = lastInfo.mate > 0 ? 100 : 0;
      text = (lastInfo.mate > 0 ? "+" : "-") + "M" + Math.abs(lastInfo.mate);
    } else {
      pct = 50 + 50 * Math.tanh(lastInfo.score / 600);
      text = (lastInfo.score > 0 ? "+" : "") + (lastInfo.score / 100).toFixed(2);
    }
    $("info").innerHTML = `depth ${lastInfo.depth}<br>${lastInfo.nodes.toLocaleString()} nodes`;
  } else {
    $("info").innerHTML = "waiting for<br>first search";
  }
  $("eval-fill").style.height = pct + "%";
  $("eval-big").textContent = text;
}

async function run(task) {
  try {
    await task();
  } catch {
    busy = false;
    $("status").textContent = "Engine offline. Run web.py.";
  }
}

async function engineMove() {
  busy = true;
  render();
  state = await api(state.moves, true);
  if (state.info) lastInfo = state.info;
  busy = false;
  render();
}

async function play(uci) {
  selected = null;
  hintMove = null;
  state = await api([...state.moves, uci], false);
  render();
  if (!state.result) await engineMove();
}

function tryMove(from, to) {
  const options = state.legal.filter(m => m.startsWith(from + to));
  if (options.length > 1) return askPromotion(from + to);
  run(() => play(options[0]));
}

function askPromotion(prefix) {
  const choices = $("promo-choices");
  choices.replaceChildren();
  for (const p of "qrbn") {
    const btn = document.createElement("button");
    btn.append(pieceEl(human === "white" ? p.toUpperCase() : p));
    btn.onclick = () => { $("promo").classList.remove("open"); run(() => play(prefix + p)); };
    choices.append(btn);
  }
  $("promo").classList.add("open");
}

board.addEventListener("pointerdown", e => {
  const sq = e.target.closest(".sq")?.dataset.sq;
  if (!sq || !myTurn()) return;
  if (selected && isLegal(selected, sq)) return tryMove(selected, sq);
  const p = pieces()[sq];
  if (!p || !isOwn(p)) { selected = null; render(); return; }

  const wasSelected = selected === sq;
  selected = sq;
  render();
  const src = board.querySelector(`[data-sq="${sq}"] .pc`);
  const ghost = src.cloneNode(true);
  ghost.classList.add("ghost");
  document.body.append(ghost);
  src.style.opacity = .25;
  drag = { from: sq, ghost, wasSelected };
  moveGhost(e);
});

function moveGhost(e) {
  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";
}

window.addEventListener("pointermove", e => drag && moveGhost(e));
window.addEventListener("pointerup", e => {
  if (!drag) return;
  const { from, ghost, wasSelected } = drag;
  drag = null;
  ghost.remove();
  const to = document.elementFromPoint(e.clientX, e.clientY)?.closest(".sq")?.dataset.sq;
  if (to && to !== from && isLegal(from, to)) return tryMove(from, to);
  if (to === from && wasSelected) selected = null;
  render();
});

async function newGame() {
  human = colorChoice === "random" ? (Math.random() < .5 ? "white" : "black") : colorChoice;
  flipped = false; selected = null; lastInfo = null; hintMove = null;
  state = await api([], false);
  render();
  if (human === "black") await engineMove();
}

async function undo() {
  let moves = state.moves.slice(0, -1);
  const turnAfter = m => (m.length % 2 === 0 ? "white" : "black");
  if (turnAfter(moves) !== human) moves = moves.slice(0, -1);
  selected = null; hintMove = null;
  state = await api(moves, false);
  render();
  if (state.turn !== human) await engineMove();
}

async function hint() {
  busy = true;
  render();
  const suggestion = await api(state.moves, true, 8);
  busy = false;
  hintMove = suggestion.moves.at(-1);
  render();
  $("status").textContent = "Try " + suggestion.san.at(-1);
}

function setPressed(container, pressed) {
  for (const b of container.children) b.setAttribute("aria-pressed", b === pressed);
}

for (let i = 1; i <= 10; i++) {
  const b = document.createElement("button");
  b.textContent = i;
  b.title = LEVEL_NAMES[i - 1];
  b.onclick = () => { level = i; setPressed($("levels"), b); $("level-name").textContent = LEVEL_NAMES[i - 1]; };
  $("levels").append(b);
}
$("levels").children[level - 1].click();

$("colors").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  colorChoice = b.dataset.color;
  setPressed($("colors"), b);
};
$("new-game").onclick = () => run(newGame);
$("undo").onclick = () => run(undo);
$("hint").onclick = () => run(hint);
$("flip").onclick = () => { flipped = !flipped; render(); };
run(newGame);
</script>
</body>
</html>
